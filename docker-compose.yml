# Local dev services - Hybrid pattern
# Dev: dùng Postgres + MinIO local (nhanh, offline, isolated)
# Staging/Prod: dùng Supabase (managed Postgres + Storage)
#
# Start: docker compose up -d
# Stop:  docker compose down
# Reset DB: docker compose down -v  (xóa volume!)

services:
  postgres:
    image: postgres:16-alpine
    container_name: 3dprint-postgres
    environment:
      POSTGRES_DB: pim_dev
      POSTGRES_USER: pim_user
      POSTGRES_PASSWORD: pim_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Init extensions cần thiết lúc startup
      - ./backend/scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pim_user -d pim_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: 3dprint-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO = S3-compatible storage, mimics Supabase Storage for dev
  # Boto3 / Django storages config giống nhau, chỉ đổi endpoint_url
  minio:
    image: minio/minio:latest
    container_name: 3dprint-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Tự tạo buckets `design-files` và `media-assets` khi MinIO ready
  minio-setup:
    image: minio/mc:latest
    container_name: 3dprint-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/design-files;
      mc mb --ignore-existing local/media-assets;
      mc anonymous set download local/media-assets;
      echo 'MinIO buckets ready';
      exit 0;
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
